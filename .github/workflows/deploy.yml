name: Build, Push & Deploy Images

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      #Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push backend image
      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/behrouzrajaei/conduit-backend:latest ./backend
          docker push ghcr.io/behrouzrajaei/conduit-backend:latest

      # Build & push frontend image
      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/behrouzrajaei/conduit-frontend:latest ./frontend
          docker push ghcr.io/behrouzrajaei/conduit-frontend:latest

     # Create .env from GitHub Secrets
      - name: Create .env file
        run: |
          cat <<EOF > .env
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=${{ secrets.DJANGO_DEBUG }}
          DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}

          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}

          FRONTEND_API_URL=${{ secrets.FRONTEND_API_URL }}
          EOF

      # Copy docker-compose.yml + .env to server
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.yaml,.env"
          target: "/home/${{ secrets.SSH_USER }}/conduit_container"

      # Deploy on server
      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.SSH_USER }}/conduit_container
            docker compose pull
            docker compose down
            docker compose up -d
