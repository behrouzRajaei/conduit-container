name: Build, Push & Deploy Images

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      #Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push backend image
      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/conduit-backend:latest ./backend
          docker push ghcr.io/${{ github.repository_owner }}/conduit-backend:latest

      # Build & push frontend image
      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest ./frontend
          docker push ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest

      # Copy docker-compose.yaml and .env to server
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.yaml,.env"
          target: "/home/${{ secrets.SSH_USER }}/conduit"

      # Deploy on server via SSH
      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.SSH_USER }}/conduit
            docker compose pull
            docker compose down
            docker compose up -d
