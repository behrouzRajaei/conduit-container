name: Build, Push & Deploy Images

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set commit SHA as VERSION
      - name: Set version
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push backend image with SHA
      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/behrouzrajaei/conduit-backend:${{ env.VERSION }} ./backend
          docker push ghcr.io/behrouzrajaei/conduit-backend:${{ env.VERSION }}
          # Optional: tag latest for local/dev testing
          docker tag ghcr.io/behrouzrajaei/conduit-backend:${{ env.VERSION }} ghcr.io/behrouzrajaei/conduit-backend:latest
          docker push ghcr.io/behrouzrajaei/conduit-backend:latest

      # Build & push frontend image with SHA
      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/behrouzrajaei/conduit-frontend:${{ env.VERSION }} ./frontend
          docker push ghcr.io/behrouzrajaei/conduit-frontend:${{ env.VERSION }}
          # Optional: tag latest for local/dev testing
          docker tag ghcr.io/behrouzrajaei/conduit-frontend:${{ env.VERSION }} ghcr.io/behrouzrajaei/conduit-frontend:latest
          docker push ghcr.io/behrouzrajaei/conduit-frontend:latest

      # Create .env file with SHA commit version
      - name: Create .env file
        run: |
          cat <<EOF > .env
          VERSION=${{ env.VERSION }}

          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=${{ secrets.DJANGO_DEBUG }}
          DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}

          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}

          FRONTEND_API_URL=/api
          EOF

      # Copy files to server via SCP
      - name: Copy files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ".env,docker-compose.yml"
          target: "/home/${{ secrets.SSH_USER }}/conduit_container"

      # Deploy on server via SSH
      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.SSH_USER }}/conduit_container
            # Force recreate containers to ensure SHA commit is used
            docker compose pull
            docker compose down
            docker compose up -d --force-recreate
            docker image prune -f
