name: Build and Push Images

on:
  workflow_dispatch:
  push:
    branches:
      - deployment-clean

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/behrouzrajaei/conduit-backend:latest
            ghcr.io/behrouzrajaei/conduit-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/behrouzrajaei/conduit-frontend:latest
            ghcr.io/behrouzrajaei/conduit-frontend:${{ github.sha }}
