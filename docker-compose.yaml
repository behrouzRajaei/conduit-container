version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
    container_name: conduit-frontend
    restart: unless-stopped
    ports:
      - "8282:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: conduit-backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_DB: conduit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

  db:
    image: postgres:9.6
    container_name: conduit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: conduit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
