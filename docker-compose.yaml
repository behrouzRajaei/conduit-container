services:
  frontend:
    image: ghcr.io/behrouzrajaei/conduit-frontend:latest
    container_name: conduit-frontend
    restart: unless-stopped
    ports:
      - "8282:80"
    depends_on:
      - backend

  backend:
    image: ghcr.io/behrouzrajaei/conduit-backend:latest
    container_name: conduit-backend
    command: ["sh", "/app/entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:9.6
    container_name: conduit-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - conduit_postgres_data:/var/lib/postgresql/data

volumes:
  conduit_postgres_data:
